name: Run SQE Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample data
        run: python src/generate_sample_data.py

      - name: Run tests
        run: pytest tests/ -v

  run-demo:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample data
        run: python src/generate_sample_data.py

      - name: Check release gates
        run: python src/check_release_gates.py

      - name: Analyze coplanarity
        run: python src/analyze_coplanarity.py

      - name: Build dashboard
        run: python src/make_dashboard.py

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: sqe-demo-reports
          path: reports/
